<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Advithi Travel Agency | Car Rentals</title>

<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fa;
  color:#222;
}

nav{
  background:#07143d;
  color:white;
  padding:17px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:22px;
  font-weight:800;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:18px;
  font-weight:bold;
}

/* HERO */

.hero{
  background:linear-gradient(135deg,#07143d,#123d76);
  color:white;
  text-align:center;
  padding:55px 20px 40px;
}

.hero h1{
  font-size:clamp(40px,7vw,70px);
  line-height:1.1;
  margin:0;
}

.hero p{
  font-size:20px;
  line-height:1.6;
  margin:18px 0 20px;
}

/* CALL + WHATSAPP UNDER HERO TEXT */

.hero-buttons{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:18px;
}

.hero-buttons a{
  display:inline-block;
  padding:13px 22px;
  border-radius:9px;
  text-decoration:none;
  font-size:17px;
  font-weight:bold;
  color:white;
}

.call-button{
  background:#123d76;
}

.whatsapp-button{
  background:#25D366;
}

/* BOOKING */

.booking{
  background:#eef2f7;
  padding:25px 6% 60px;
}

.booking-box{
  max-width:900px;
  margin:0 auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.booking-title{
  text-align:center;
  color:#07143d;
  font-size:32px;
  margin:0 0 8px;
}

.booking-subtitle{
  text-align:center;
  color:#666;
  margin:0 0 28px;
}

.booking-form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.field{
  display:flex;
  flex-direction:column;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-weight:bold;
  color:#07143d;
  margin-bottom:7px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
  background:white;
  outline:none;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#07143d;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.submit{
  grid-column:1/-1;
  border:0;
  border-radius:10px;
  padding:17px;
  background:#07143d;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.submit:disabled{
  opacity:.6;
}

.booking-note{
  text-align:center;
  color:#666;
  font-size:13px;
  margin:14px 0 0;
}

/* SECTIONS */

section{
  padding:65px 7%;
}

section h2{
  text-align:center;
  font-size:32px;
  margin:0 0 35px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}

.card{
  background:white;
  padding:28px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  text-align:center;
}

.icon{
  font-size:42px;
  margin-bottom:12px;
}

.card h3{
  margin:8px 0;
}

.card p{
  color:#666;
  line-height:1.5;
}

.cars{
  background:#eef2f7;
}

.car-name{
  font-size:22px;
  font-weight:bold;
}

.about{
  background:#07143d;
  color:white;
  text-align:center;
}

.about p{
  max-width:850px;
  margin:auto;
  font-size:18px;
  line-height:1.8;
}

.contact{
  background:#eaf7f0;
  text-align:center;
}

.contact a{
  display:inline-block;
  margin:8px;
  padding:14px 22px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  background:#07143d;
  color:white;
}

footer{
  background:#050f2e;
  color:white;
  text-align:center;
  padding:25px;
}

@media(max-width:700px){

  nav{
    flex-direction:column;
    gap:12px;
  }

  nav a{
    margin:0 6px;
    font-size:14px;
  }

  .hero{
    padding:45px 18px 30px;
  }

  .hero h1{
    font-size:42px;
  }

  .hero p{
    font-size:17px;
  }

  .hero-buttons{
    gap:8px;
  }

  .hero-buttons a{
    padding:12px 17px;
    font-size:15px;
  }

  .booking{
    padding:20px 12px 45px;
  }

  .booking-box{
    padding:22px 16px;
  }

  .booking-form{
    grid-template-columns:1fr;
  }

  .field.full,
  .submit{
    grid-column:auto;
  }
}
</style>
</head>
